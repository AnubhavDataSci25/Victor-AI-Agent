[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "victor-ai-agent"
version = "2.0.0"
description = "Victor 2.0 — A voice-first AI computer assistant powered by Gemini Live API"
requires-python = ">=3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
